<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">NLP research architecture for extracting AI disclosures from 10-K filings</title>
  <desc id="desc">A methodology-focused academic figure showing document preprocessing, prompt specification, language-model inference, structured parsing, corpus aggregation, and validation, with outputs shown only as secondary artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#526273"/>
    </marker>
    <style>
      .title { font: 600 29px Georgia, 'Times New Roman', serif; fill: #152a43; }
      .head { font: 600 18px Georgia, 'Times New Roman', serif; fill: #152a43; }
      .sub { font: 15px Arial, Helvetica, sans-serif; fill: #596777; }
      .label { font: 600 11px Arial, Helvetica, sans-serif; letter-spacing: 1.5px; fill: #647181; }
      .body { font: 14px Arial, Helvetica, sans-serif; fill: #344352; }
      .small { font: 12.5px Arial, Helvetica, sans-serif; fill: #657382; }
      .code { font: 12px 'Courier New', monospace; fill: #344352; }
      .panel { fill: #ffffff; stroke: #aeb8c3; stroke-width: 1; }
      .method { fill: #f5f8fa; stroke: #788b9d; stroke-width: 1.1; }
      .rule { stroke: #c9d0d7; stroke-width: 1; }
      .flow { stroke: #526273; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="720" fill="#f7f8fa"/>
  <rect x="40" y="28" width="1320" height="664" fill="#ffffff" stroke="#c5ccd4"/>
  <line x1="40" y1="28" x2="1360" y2="28" stroke="#152a43" stroke-width="5"/>
  <text x="70" y="74" class="title">NLP research architecture for corporate AI disclosure analysis</text>
  <text x="70" y="103" class="sub">From long-form regulatory documents to reproducible, structured representations</text>

  <!-- Input corpus -->
  <g transform="translate(70 150)">
    <text x="0" y="0" class="label">INPUT CORPUS</text>
    <rect x="0" y="17" width="205" height="348" class="panel"/>
    <text x="20" y="53" class="head">Form 10-K</text>
    <text x="20" y="76" class="head">documents</text>
    <line x1="20" y1="94" x2="185" y2="94" class="rule"/>
    <text x="20" y="123" class="body">10 US firms</text>
    <text x="20" y="149" class="body">HTML / Inline XBRL</text>
    <text x="20" y="175" class="body">Long-form narrative</text>
    <text x="20" y="201" class="body">Financial disclosures</text>
    <line x1="20" y1="222" x2="185" y2="222" class="rule"/>
    <text x="20" y="251" class="small">Unit of analysis</text>
    <text x="20" y="273" class="body">Company filing</text>
    <text x="20" y="308" class="small">Research target</text>
    <text x="20" y="330" class="body">AI-related language</text>
  </g>

  <path d="M287 341 H324" class="flow"/>

  <!-- Main NLP architecture -->
  <g transform="translate(338 150)">
    <text x="0" y="0" class="label">NLP METHODOLOGY</text>
    <rect x="0" y="17" width="746" height="348" class="panel"/>

    <g transform="translate(22 42)">
      <rect width="214" height="126" class="method"/>
      <text x="16" y="29" class="label">01 · TEXT PREPARATION</text>
      <text x="16" y="60" class="head">Document normalisation</text>
      <text x="16" y="86" class="small">HTML parsing · tag removal</text>
      <text x="16" y="107" class="small">URL filtering · whitespace cleanup</text>
    </g>

    <path d="M248 105 H270" class="flow"/>

    <g transform="translate(282 42)">
      <rect width="214" height="126" class="method"/>
      <text x="16" y="29" class="label">02 · TASK SPECIFICATION</text>
      <text x="16" y="60" class="head">Structured prompting</text>
      <text x="16" y="86" class="small">Semantic categories · null rules</text>
      <text x="16" y="107" class="small">Units · response delimiters</text>
    </g>

    <path d="M508 105 H530" class="flow"/>

    <g transform="translate(542 42)">
      <rect width="182" height="126" class="method"/>
      <text x="16" y="27" class="label">03 · EXTRACTION</text>
      <text x="16" y="50" class="head">Gemini-based</text>
      <text x="16" y="71" class="head">Information</text>
      <text x="16" y="92" class="head">Extraction</text>
      <text x="16" y="111" class="small">Filing-level inference</text>
      <text x="16" y="123" font-family="Arial, Helvetica, sans-serif" font-size="9.5" fill="#657382">Original implementation: Gemini 2.0 Flash</text>
    </g>

    <path d="M633 180 V204" class="flow"/>

    <g transform="translate(412 216)">
      <rect width="312" height="103" class="method"/>
      <text x="16" y="29" class="label">04 · STRUCTURED PARSING</text>
      <text x="16" y="58" class="code">Risk | Opportunity | Investment</text>
      <text x="16" y="82" class="code">Investment Value (USD bn)</text>
    </g>

    <path d="M399 268 H373" class="flow"/>

    <g transform="translate(22 216)">
      <rect width="338" height="103" class="method"/>
      <text x="16" y="29" class="label">05 · CORPUS-LEVEL AGGREGATION</text>
      <text x="16" y="58" class="head">Reusable extraction function</text>
      <text x="16" y="82" class="small">Consistent schema across ten heterogeneous filings</text>
    </g>
  </g>

  <path d="M1096 341 H1133" class="flow"/>

  <!-- Secondary output -->
  <g transform="translate(1147 150)">
    <text x="0" y="0" class="label">RESEARCH ARTIFACTS</text>
    <rect x="0" y="17" width="181" height="348" class="panel"/>
    <text x="18" y="53" class="head">Structured data</text>
    <line x1="18" y1="70" x2="163" y2="70" class="rule"/>
    <text x="18" y="99" class="body">Company summaries</text>
    <text x="18" y="125" class="body">Numeric fields</text>
    <text x="18" y="151" class="body">Sentiment labels</text>
    <text x="18" y="177" class="body">Comparative table</text>
    <line x1="18" y1="199" x2="163" y2="199" class="rule"/>
    <text x="18" y="228" class="small">Outputs demonstrate</text>
    <text x="18" y="248" class="small">the pipeline; they are</text>
    <text x="18" y="268" class="small">not the primary research</text>
    <text x="18" y="288" class="small">contribution.</text>
  </g>

  <!-- Evaluation layer -->
  <g transform="translate(70 555)">
    <text x="0" y="0" class="label">EVALUATION AND RESEARCH EXTENSIONS</text>
    <rect x="0" y="17" width="1258" height="74" fill="#fafbfc" stroke="#aeb8c3"/>
    <line x1="252" y1="31" x2="252" y2="77" class="rule"/>
    <line x1="503" y1="31" x2="503" y2="77" class="rule"/>
    <line x1="754" y1="31" x2="754" y2="77" class="rule"/>
    <line x1="1005" y1="31" x2="1005" y2="77" class="rule"/>
    <text x="20" y="48" class="head">Evidence grounding</text>
    <text x="20" y="70" class="small">Source quotes and chunk IDs</text>
    <text x="272" y="48" class="head">Schema validation</text>
    <text x="272" y="70" class="small">Reject malformed responses</text>
    <text x="523" y="48" class="head">Context management</text>
    <text x="523" y="70" class="small">Section retrieval and chunking</text>
    <text x="774" y="48" class="head">Reproducibility</text>
    <text x="774" y="70" class="small">Version, prompt, cost, latency</text>
    <text x="1025" y="48" class="head">Human verification</text>
    <text x="1025" y="70" class="small">Compare claims with filings</text>
  </g>

  <line x1="70" y1="667" x2="1328" y2="667" class="rule"/>
  <text x="70" y="690" class="small">Figure 1. Methodological architecture for LLM-assisted information extraction from long-form financial documents.</text>
</svg>
